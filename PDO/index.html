    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <div class="card rounded-4">
                    <div class="card-header border-secondary px-4 py-3">
                        <h1 class="h3 mb-0 text-white">Cadastro de Funcionário</h1>
                    </div>

                    <div class="card-body p-4">
                        <form method="POST" action="salvar.php">
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label for="disci" class="form-label">Disciplina</label>
                                    <input type="text" class="form-control" id="disci" name="disci" placeholder="Digite o nome da disciplina" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="dura" class="form-label">Duração</label>
                                    <input type="text" class="form-control" id="dura" name="dura" placeholder="Ex: 12345" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="professor" class="form-label">Professor</label>
                                    <input type="text" class="form-control" id="professor" name="professor" placeholder="Digite o nome do professor" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="nascimento" class="form-label">Horário</label>
                                    <input type="time" class="form-control" id="nascimento" name="nascimento" required>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
</body>
</html>
