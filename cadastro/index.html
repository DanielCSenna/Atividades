<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <div class="card rounded-4">
                    <div class="card-header border-secondary px-4 py-3">
                        <h1 class="h3 mb-0 text-white">Cadastro de Funcionário</h1>
                    </div>

                    <div class="card-body p-4">
                        <form method="POST" action="salvar.php">
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome completo" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="matricula" class="form-label">Matrícula</label>
                                    <input type="text" class="form-control" id="matricula" name="matricula" placeholder="Ex: 12345" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="cpf" class="form-label">CPF</label>
                                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="nascimento" class="form-label">Nascimento</label>
                                    <input type="date" class="form-control" id="nascimento" name="nascimento" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="cargo" class="form-label">Cargo</label>
                                    <input type="text" class="form-control" id="cargo" name="cargo" placeholder="Ex: Analista" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="funcao" class="form-label">Função</label>
                                    <input type="text" class="form-control" id="funcao" name="funcao" placeholder="Ex: Desenvolvimento" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="data_de_admissao" class="form-label">Data de admissão</label>
                                    <input type="date" class="form-control" id="data_de_admissao" name="data_de_admissao" required>
                                </div>

                                <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                    <button type="reset" class="btn btn-outline-light px-4">Limpar</button>
                                    <button type="submit" class="btn btn-primary px-4">Cadastrar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
